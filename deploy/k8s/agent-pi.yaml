# One replica until ai-gateway-agent is deployed and workbench points at it:
# before that, a second replica's sessions would be missing from the sidebar.
#
# Each pod owns its sessions on its own volume for life, so the pod's name is its
# AGENT_INSTANCE_ID and session IDs read assistant.agent-pi-0.<n>. Replicas can
# only be added. Scaling down strands the sessions on the removed volume.
#
# Each new replica needs an AGENT_URLS entry in ai-gateway-agent and in
# t10-livekit-agent. The secret holds AUTH_CLIENT_SECRET and LLM_API_KEY.
apiVersion: v1
kind: Service
metadata:
  name: agent-pi
  namespace: t10
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: agent-pi
  ports:
    - name: http
      port: 18100
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-pi
  namespace: t10
spec:
  serviceName: agent-pi
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-pi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-pi
        # Lets these pods through auth-server's network policy.
        t10.dev/auth-client: "true"
        # Lets these pods reach ai-gateway-llm.
        t10.dev/llm-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's node user. The volume has to be writable by it.
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-pi
          image: assistant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18100
          env:
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENT_CONFIG
              value: /app/apps/assistant/config/agent.json
            - name: PORT
              value: "18100"
            - name: AGENT_DATA_DIR
              value: /data
            - name: AUTH_KIND
              value: jwt
            - name: JWT_ALGORITHMS
              value: ES256
            - name: JWT_JWKS_URL
              value: http://auth-server.t10.svc.cluster.local:18000/.well-known/jwks.json
            - name: JWT_ISSUER
              value: https://auth.example.com
            # People's tokens carry t10, and a voice agent's grants agent-pi.
            - name: JWT_AUDIENCE
              value: t10,agent-pi
            - name: JWT_REQUIRED_SCOPES
              value: agent:use
            - name: JWT_TENANT_CLAIM
              value: tid
            - name: AUTH_URL
              value: http://auth-server.t10.svc.cluster.local:18000
            - name: LLM_BASE_URL
              value: http://ai-gateway-llm.t10.svc.cluster.local:18080/v1
            # auth-server's clients.yaml has to allow these before this rolls out.
            # Through ai-gateway-tools, which checks and records every tool call.
            - name: COLLAB_MCP_URL
              value: http://ai-gateway-tools.t10.svc.cluster.local:18095/mcp/collab
            - name: KNOWLEDGE_MCP_URL
              value: http://ai-gateway-tools.t10.svc.cluster.local:18095/mcp/knowledge
            # Every module the gateway offers together. A new module needs no entry here.
            - name: MODULES_MCP_URL
              value: http://ai-gateway-tools.t10.svc.cluster.local:18095/mcp/modules
            # Tenants' own connectors, at /mcp/connector/<id>, when AGENT_CONTROL_URL is set.
            - name: TOOL_GATEWAY_URL
              value: http://ai-gateway-tools.t10.svc.cluster.local:18095
            - name: GRANT_ACTIONS
              value: agent:use,work:read,work:write,knowledge:read,property:read,property:propose
            - name: GRANT_AUDIENCES
              value: agent-pi,t10-collab,t10-knowledge,t10-property,ai-gateway-tools
            # Concurrency & capacity limits
            - name: MAX_RUNS
              value: "1500"
            - name: MAX_RUNS_PER_USER
              value: "1500"
            - name: MAX_SESSIONS_PER_USER
              value: "2000"
          envFrom:
            - secretRef:
                name: agent-pi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
