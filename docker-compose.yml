name: agent-pi

# Both apps build from this repository root (the npm workspace).
#   docker compose up -d --build                    # assistant on :9800
# Assistant reads ./.env (copy .env.example first).

x-hardening: &hardening
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  assistant:
    <<: *hardening
    build:
      context: .
    image: ${ASSISTANT_IMAGE:-assistant:latest}
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_CONFIG: /app/apps/assistant/config/agent.json
      PORT: "9800"
      AGENT_DATA_DIR: /data
      # Give each replica its own id and volume; session ids are <agent>.<this id>.<n>.
      AGENT_INSTANCE_ID: ${AGENT_INSTANCE_ID:-agent-1}
    ports:
      - "${ASSISTANT_PORT:-9800}:9800"
    volumes:
      - assistant-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  assistant-data:
    name: ${ASSISTANT_DATA_VOLUME:-agent-pi-assistant-data}
