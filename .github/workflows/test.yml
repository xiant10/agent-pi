name: test

# Builds and tests every push to main and every pull request. GitHub sets CI, so
# a test that needs the database fails here instead of skipping.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
