name: agent-pi

# Both apps build from this repository root (the npm workspace).
#   docker compose up -d --build                    # assistant on :9800
#   docker compose --profile sales up -d --build    # also the sales agent on :9810 (needs kaidan-net)
#   docker compose --profile sales up -d --build sales
# Assistant reads ./.env; sales reads apps/sales/.env (copy each .env.example first).

x-hardening: &hardening
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  assistant:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/assistant/Dockerfile
    image: ${ASSISTANT_IMAGE:-assistant:latest}
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "9800"
      AGENT_DATA_DIR: /data
      # Give each replica its own id and volume; session ids are prefixed with it.
      AGENT_INSTANCE_ID: ${AGENT_INSTANCE_ID:-agent-1}
    ports:
      - "${ASSISTANT_PORT:-9800}:9800"
    volumes:
      - assistant-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

  sales:
    <<: *hardening
    profiles: [sales]
    build:
      context: .
      dockerfile: apps/sales/Dockerfile
    image: ${SALES_IMAGE:-sales:latest}
    env_file:
      - path: apps/sales/.env
        required: false
    environment:
      PORT: "9810"
      LIVEKIT_ADAPTER_PORT: "8101"
      AGENT_DATA_DIR: /data
      TZ: ${AGENT_DEFAULT_TIME_ZONE:-Asia/Shanghai}
    ports:
      - "${SALES_PORT:-9810}:9810"
      - "${LIVEKIT_ADAPTER_HOST_PORT:-8102}:8101"
    volumes:
      - sales-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      kaidan-net:
        aliases:
          - agent-pi-sales

networks:
  # Shared with agent-gateway and data-api. `docker network create kaidan-net` if the Kaidan stack isn't running.
  kaidan-net:
    name: ${KAIDAN_NETWORK:-kaidan-net}
    external: true

volumes:
  assistant-data:
    name: ${ASSISTANT_DATA_VOLUME:-agent-pi-assistant-data}
  sales-data:
    name: ${SALES_DATA_VOLUME:-agent-pi-sales-data}
